<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f9fc"><meta name="robots" content="noindex">
<title>解题提示 · 小玩学家</title>
<link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header><a class="brand" href="../" aria-label="小玩学家"><img src="assets/logo.png" alt="小玩学家"></a><span>给思考一点时间</span></header>
<main>
<section id="missing" hidden><div class="eyebrow">小玩学家 · 解题提示</div><h1>每一个发现，<br>都从想一想开始。</h1><p>请从公众号回复关键词后获得的链接，进入对应题目的提示页。</p><div class="notice">如果链接已失效，请回到公众号重新获取。</div></section>
<section id="puzzle" hidden>
<div class="eyebrow"><span class="small-line"></span> 解题提示</div>
<h1 id="title"></h1><p class="intro">别急，先试着自己想一想。<br>准备好的提示，会在倒计时结束后出现。</p>
<article class="hint active" id="first">
<div class="card-top"><span class="step">01</span><h2>第一提示</h2><span class="status" id="status1">思考时间</span></div>
<div id="wait1" class="waiting"><div class="dial" id="dial"><div><span class="timer" id="timer1">03:00</span><span class="timer-caption">后解锁第一提示</span></div></div><p class="encourage">换个角度，也许就有新发现。</p></div>
<div class="reveal" id="hint1" hidden></div><div class="card-bottom" id="bottom1">让灵感再飞一会儿</div>
</article>
<article class="hint secondary" id="second" hidden><div class="card-top"><span class="step">02</span><h2>第二提示</h2><span class="status" id="status2">稍后解锁</span></div><div id="wait2" class="second-wait"><p id="second-note">第一提示出现后，开始下一段思考时间。</p><span class="timer small" id="timer2"></span></div><div class="reveal" id="hint2" hidden></div></article>
<p class="footnote" id="footnote">提示会自动出现，刷新页面不会重置等待时间。</p>
</section>
</main><footer>小玩学家<span>保持好奇，享受发现。</span></footer>
<script id="question" type="application/json">null</script><script type="module" src="assets/app.js"></script>
</body></html>
